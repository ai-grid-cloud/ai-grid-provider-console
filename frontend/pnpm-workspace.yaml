packages:
  - .
allowBuilds:
  esbuild: true

overrides:
  # GHSA-w74x-v6f9-j3xg (URI scheme spoofing): @perses-dev/plugin-system 0.56.0-beta.1 pins
  # fast-uri 3.1.8. Drop this once the Perses release in use depends on fast-uri 3.1.9 or later.
  'fast-uri@<3.1.9': 3.1.9
  # GHSA-6pq8-jhm2-2vcw (qs.stringify denial of service): @perses-dev/explore 0.56.0-beta.1 pins
  # qs 6.16.0. Drop this once the Perses release in use depends on qs 6.16.1 or later.
  'qs@>=6.7.0 <6.16.1': 6.16.1

# Patches to Perses's published builds, each to drop once a Perses release does the same itself.
patchedDependencies:
  # Escape names in the bar chart tooltip: ECharts renders the tooltip formatter's string as HTML,
  # so the patch escapes the category and series names and the marker color (& < > " ') in
  # lib/BarChartBase.js, the build Vite bundles, as the pie chart already does
  # (src/pages/monitoring/persesPlugins.ts).
  '@perses-dev/bar-chart-plugin@0.15.0-beta.1': patches/@perses-dev__bar-chart-plugin@0.15.0-beta.1.patch
  # The time series tooltip finds the series near the cursor from the y axis scale's private
  # _interval (and a log scale's _extent), which ECharts 6.1 no longer has, so on the ECharts these
  # Perses releases require it never shows. The patch reads the same values where ECharts 6.1 keeps
  # them (TimeSeriesTooltip/nearby-series.js).
  '@perses-dev/components@0.56.0-beta.1': patches/@perses-dev__components@0.56.0-beta.1.patch
