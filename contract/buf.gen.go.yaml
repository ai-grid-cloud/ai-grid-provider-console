# Go for the BFF relay, from the vendored backend contract (see COMMIT).
#
# The BFF terminates Connect from the browser and forwards to the backend over gRPC
# (docs/adr/0004-the-bff-is-a-thin-relay.md), so it needs connect-go handlers for the same
# services the backend serves.
#
# Managed mode rewrites go_package: the vendored files declare the backend's module path,
# which is not where this output lives. It is disabled for the dependency modules, which
# already exist as Go modules — rewriting those would point the generated imports at
# packages nothing provides.
#
# Plugins run through `go run` at pinned versions, as mock/proto/buf.gen.yaml does: nothing
# to install, no Buf Schema Registry round trip, and so no rate limiting.
#
# Generated into bff/gen/contract and not committed. Run `make generate-contract`.
version: v2

managed:
  enabled: true

  disable:
    - module: buf.build/googleapis/googleapis
    - module: buf.build/bufbuild/protovalidate
    - module: buf.build/grpc-ecosystem/grpc-gateway

  override:
    - file_option: go_package_prefix
      value: github.com/ai-grid-cloud/ai-grid-provider-console/bff/gen/contract

plugins:
  - local: ["go", "run", "google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12"]
    out: ../bff/gen/contract
    opt: paths=source_relative

  - local: ["go", "run", "connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.18.1"]
    out: ../bff/gen/contract
    opt: paths=source_relative
