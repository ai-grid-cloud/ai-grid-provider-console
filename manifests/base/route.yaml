apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ai-grid-provider-console
  annotations:
    # Browsers that have seen the console keep to HTTPS for a year.
    haproxy.router.openshift.io/hsts_header: max-age=31536000
spec:
  to:
    kind: Service
    name: ai-grid-provider-console
  port:
    targetPort: https
  tls:
    termination: reencrypt
    insecureEdgeTerminationPolicy: Redirect
