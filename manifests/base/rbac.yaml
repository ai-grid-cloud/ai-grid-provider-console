# kube-auth-proxy validates bearer tokens with TokenReviews
# (--enable-k8s-token-validation), which needs system:auth-delegator.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-grid-provider-console-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: ai-grid-provider-console
    namespace: ai-grid
---
# ai-grid-backend reads ManagedClusters with the pod's ServiceAccount. These
# rules are the console's part of deploy/openshift/rbac.yaml in the backend
# repository; grow them there first when the backend needs more. The backend
# also reads the ai-grid-policies/ai-grid-ready Policy to report a cluster's
# provisioning. This base does not grant that get: ai-grid-env-setup does, with
# a Role in apps/ai-grid-policies. Without it, a cluster added to the grid stays
# at Provisioning in the console.
#
# TODO(backend-as-caller): delete this ClusterRole and its binding once the
# backend builds its hub client from the forwarded user token (ADR-0004,
# "Backend authorization"). The ServiceAccount then only needs system:auth-delegator
# for the proxy's TokenReviews. Order matters: ship the backend that does this, and the
# console that calls it, first, or the Clusters page stops working.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-grid-provider-console-backend
rules:
  - apiGroups: ["cluster.open-cluster-management.io"]
    resources: ["managedclusters"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-grid-provider-console-backend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ai-grid-provider-console-backend
subjects:
  - kind: ServiceAccount
    name: ai-grid-provider-console
    namespace: ai-grid
---
# Who may use the console: the BFF asks the hub whether the caller may post to
# the non-resource URL /ai-grid/provider-console. This ClusterRole grants it, and
# so does any role with a `*` nonResourceURLs rule for `post` (or every verb),
# such as cluster-admin. Nobody is bound here; bind provider admins with
# `oc adm policy add-cluster-role-to-group ai-grid-provider-admin <group>`, and
# check one with `oc auth can-i post /ai-grid/provider-console --as=<user>`. The
# chart's templates/provider-admin.yaml says more.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-grid-provider-admin
rules:
  - nonResourceURLs: ["/ai-grid/provider-console"]
    verbs: ["post"]
