apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-grid-provider-console
spec:
  replicas: 1
  # Recreate, so a Deployment rollout never runs two pods at once: the backend serializes each
  # organization's writes with in-process locks, which hold only with one backend
  # (ai-grid-cloud/ai-grid-provider-backend#16). An upgrade stops the console until the new pod is ready.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-grid-provider-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-grid-provider-console
    spec:
      serviceAccountName: ai-grid-provider-console
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        # Login: OpenShift OAuth via kube-auth-proxy, the proxy RHOAI uses.
        # Flags follow the opendatahub-operator gateway template. The proxy
        # forwards the user's access token and name to the BFF in
        # X-Forwarded-Access-Token and X-Forwarded-User.
        - name: kube-auth-proxy
          image: kube-auth-proxy
          args:
            - --provider=openshift
            - --https-address=0.0.0.0:8443
            - --http-address=127.0.0.1:4180
            - --tls-cert-file=/etc/tls/private/tls.crt
            - --tls-key-file=/etc/tls/private/tls.key
            - --upstream=http://127.0.0.1:8080/
            # Longer than the BFF's longest answer (its 60s server write timeout), so a slow write
            # ends in the BFF's own answer; the default, 30s, would cut BACKEND_WRITE_TIMEOUT's.
            - --upstream-timeout=65s
            - --redirect-url=$(OAUTH2_PROXY_REDIRECT_URL)
            - --email-domain=*
            - --scope=user:full
            - --skip-provider-button
            - --pass-access-token=true
            - --pass-user-headers=true
            # The caller's token and name go to the BFF as request headers only (the two flags
            # above), never back to the browser. --set-xauthrequest=true, which the gateway template
            # has, adds X-Auth-Request-User, -Email and -Groups and, with --pass-access-token,
            # X-Auth-Request-Access-Token to every signed-in response, where any script in the page
            # could read the token that the HttpOnly cookie keeps from it. The gateway calls the
            # proxy's /oauth2/auth from Envoy (ext_authz), which keeps those headers from the
            # browser; here the proxy answers the browser itself. --set-authorization-header and
            # --set-basic-auth stay off, their default. hack/test-chart-kind.sh checks that no
            # response carries the token.
            - --set-xauthrequest=false
            # Drop the X-Forwarded-* identity headers (user, email, groups, preferred
            # username, access token) a client sends before setting its own: the BFF
            # trusts them. The proxy's default, stated so that a change of default can't
            # let a caller name itself; hack/test-chart-kind.sh sends forged ones.
            - --skip-auth-strip-headers=true
            - --skip-jwt-bearer-tokens=true
            - --enable-k8s-token-validation=true
            - --use-system-trust-store=true
            - --cookie-name=_ai_grid_console
            - --cookie-secure=true
            - --cookie-httponly=true
            - --cookie-samesite=lax
            - --cookie-expire=24h
            - --cookie-refresh=1h
            # The BFF listens on loopback, so the kubelet probes it through
            # the proxy. /readyz carries no user data and needs no login.
            - --skip-auth-route=^/readyz$
            # The browser's Connect calls to the backend (the BFF relays /ai_grid.v1.*): a call
            # without a valid session is 401, which the Connect client reads as Unauthenticated,
            # not a redirect to the login page, which fetch can't follow.
            - --api-route=^/ai_grid\.v1\.
          env:
            # Created by hack/deploy.sh together with the OAuthClient.
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: ai-grid-provider-console-oauth
                  key: OAUTH2_PROXY_CLIENT_ID
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ai-grid-provider-console-oauth
                  key: OAUTH2_PROXY_CLIENT_SECRET
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: ai-grid-provider-console-oauth
                  key: OAUTH2_PROXY_COOKIE_SECRET
            - name: OAUTH2_PROXY_REDIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: ai-grid-provider-console-oauth
                  key: OAUTH2_PROXY_REDIRECT_URL
          ports:
            - name: https
              containerPort: 8443
          readinessProbe:
            httpGet:
              path: /ready
              port: https
              scheme: HTTPS
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /ping
              port: https
              scheme: HTTPS
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tls
              mountPath: /etc/tls/private
              readOnly: true
            - name: tmp
              mountPath: /tmp

        # The console: a thin BFF plus the built frontend. It relays the
        # frontend's Connect calls to the backend container over loopback,
        # with the caller's identity in the request headers.
        # It binds to loopback so that nothing on the pod network can reach
        # it with forged identity headers: every request comes through the
        # proxy. The only hub call it makes is a SelfSubjectAccessReview with
        # the caller's token (isProviderAdmin), using the in-cluster API
        # address and CA that every pod gets.
        - name: bff
          image: ai-grid-provider-console
          args:
            - --bind-address=127.0.0.1
            - --port=8080
            - --static-assets-dir=/static
            - --backend-address=127.0.0.1:9090
          env:
            - name: GRID_CONSUMER_URL
              value: ""
            - name: MAP_TILE_URL
              value: ""
            - name: MAP_TILE_ATTRIBUTION
              value: ""
            - name: BILLING_URL
              value: ""
            - name: LOG_LEVEL
              value: info
            # The Deploy model wizard's hardware choices: the chart's default
            # console.models.hardware, as the chart renders it (hack/check-chart.sh).
            - name: MODEL_HARDWARE
              value: '[{"accelerator":"nvidia.com/gpu","defaults":{"accelerators":1,"cpu":"2","memory":"16Gi"},"description":"For clusters with NVIDIA GPUs.","id":"nvidia-gpu","label":"NVIDIA GPU"},{"defaults":{"cpu":"4","memory":"8Gi"},"description":"For x86_64 clusters without GPUs.","env":{"OMP_NUM_THREADS":"4","VLLM_CPU_KVCACHE_SPACE":"4"},"id":"cpu","image":"registry.redhat.io/rhaii/vllm-cpu-rhel9@sha256:0ec0f5ff9a5ff263f58db0cfb19e3d7eef24b94c2d8629fe5145f5a8747e28c9","imageName":"vLLM CPU 0.18.0 (OpenShift AI 3.6)","label":"CPU only"}]'
          # Probed through the proxy (same pod, port 8443): the kubelet cannot
          # reach a loopback port. /readyz also pings the backend, so this one
          # probe gates traffic for all three containers. No liveness probe:
          # it would restart the BFF whenever the proxy is down.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8443
              scheme: HTTPS
            periodSeconds: 5
            # /readyz waits up to 3s for the backend's Ping; leave room for it
            # plus the hop through the proxy, or a slow ping flaps readiness.
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]

        # ai-grid-backend: owns every call to the hub API, Keycloak and
        # metrics using the pod's ServiceAccount. Its gRPC port and its REST
        # gateway (with Swagger UI, unauthenticated, on every interface by
        # default) bind to loopback, so only the BFF can reach the backend;
        # nothing on the pod network can. The kubelet therefore cannot probe
        # it directly: the BFF's /readyz pings it and takes the pod out of the
        # Service when it does not answer.
        - name: ai-grid-backend
          image: ai-grid-backend
          args:
            - --listen-address=127.0.0.1:9090
            - --http-listen-address=127.0.0.1:8081
          env:
            # Keycloak settings and credentials all come from one secret that
            # hack/deploy.sh creates from KEYCLOAK_URL, KEYCLOAK_REALM,
            # KEYCLOAK_ADMIN_REALM, KEYCLOAK_ADMIN_USERNAME and
            # KEYCLOAK_ADMIN_PASSWORD, so this manifest carries no values of
            # any one environment. Every key is required: without the secret
            # the container does not start, which is the point, because the
            # backend would otherwise fall back to its built-in admin/admin.
            - name: KEYCLOAK_URL
              valueFrom:
                secretKeyRef:
                  name: ai-grid-backend-keycloak
                  key: url
            - name: KEYCLOAK_ADMIN_REALM
              valueFrom:
                secretKeyRef:
                  name: ai-grid-backend-keycloak
                  key: admin-realm
            - name: KEYCLOAK_REALM
              valueFrom:
                secretKeyRef:
                  name: ai-grid-backend-keycloak
                  key: realm
            - name: KEYCLOAK_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ai-grid-backend-keycloak
                  key: username
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-grid-backend-keycloak
                  key: password
            # Where organization identity providers' client secrets are (../idp-secrets).
            - name: AI_GRID_IDP_SECRET_NAMESPACE
              value: ai-grid-idp-secrets
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: tls
          secret:
            secretName: ai-grid-provider-console-tls
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 10Mi
