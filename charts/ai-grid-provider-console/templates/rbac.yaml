# kube-auth-proxy validates bearer tokens with TokenReviews
# (--enable-k8s-token-validation), which needs system:auth-delegator.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "console.fullname" . }}-auth-delegator
  labels:
    {{- include "console.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: {{ include "console.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# ai-grid-backend reads ManagedClusters with the pod's ServiceAccount, and with
# backend.clusterWrites patches their labels (Add to AI grid, Edit and Remove; admission.yaml limits
# which). These rules are the console's part of deploy/openshift/rbac.yaml in the backend
# repository; grow them there first when the backend needs more. The backend also reads the
# ai-grid-policies/ai-grid-ready Policy to report a cluster's provisioning. This chart does not
# grant that get: ai-grid-env-setup does, with a Role in apps/ai-grid-policies. Without it, a
# cluster added to the grid stays at Provisioning in the console.
#
# In git mode (backend.git.url) the backend also reads what the spokes report about Models and
# Subscriptions from the catalog's Argo CD Applications: the Role at the end of this file.
#
# TODO(backend-as-caller): delete this ClusterRole and its binding once the backend builds its hub
# client from the forwarded user token (ADR-0004, "Backend authorization").
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "console.fullname" . }}-backend
  labels:
    {{- include "console.labels" . | nindent 4 }}
rules:
  - apiGroups: ["cluster.open-cluster-management.io"]
    resources: ["managedclusters"]
    verbs: ["get", "list", "watch"{{ if .Values.backend.clusterWrites }}, "patch"{{ end }}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "console.fullname" . }}-backend
  labels:
    {{- include "console.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "console.fullname" . }}-backend
subjects:
  - kind: ServiceAccount
    name: {{ include "console.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.backend.git.url }}
---
# In git mode the backend reads the status of Models and Subscriptions from the health of the
# catalog's Argo CD Applications in openshift-gitops (AI_GRID_CATALOG_APP_NAMESPACE, which the chart
# leaves at the backend's default): one Application per cluster and ApplicationSet,
# acm-models-catalog-{models,ingress,subscriptions}-<cluster>. Without this Role the backend logs
# once that it can't list them, every model stays Saved to Git and no subscription has a phase.
# list can't be limited by name, so the backend can read every Application in openshift-gitops,
# with any inline Helm values or plugin settings their specs carry: keep secrets out of Application
# specs there. These rules are the backend's deploy/openshift/rbac.yaml
# (ai-grid-provider-backend-catalog-status).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "console.fullname" . }}-catalog-status
  namespace: openshift-gitops
  labels:
    {{- include "console.labels" . | nindent 4 }}
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "console.fullname" . }}-catalog-status
  namespace: openshift-gitops
  labels:
    {{- include "console.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "console.fullname" . }}-catalog-status
subjects:
  - kind: ServiceAccount
    name: {{ include "console.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
