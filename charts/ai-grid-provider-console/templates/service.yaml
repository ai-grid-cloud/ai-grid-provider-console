apiVersion: v1
kind: Service
metadata:
  name: {{ include "console.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "console.labels" . | nindent 4 }}
  {{- if .Values.tls.serviceCA }}
  annotations:
    # OpenShift issues a serving certificate for the proxy's HTTPS listener.
    service.beta.openshift.io/serving-cert-secret-name: {{ include "console.tlsSecretName" . }}
  {{- end }}
spec:
  selector:
    {{- include "console.selectorLabels" . | nindent 4 }}
  ports:
    - name: https
      port: 8443
      targetPort: https
