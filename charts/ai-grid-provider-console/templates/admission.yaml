{{- if .Values.backend.clusterWrites }}
# With patch on ManagedClusters the backend could reach spec (hubAcceptsClient detaches a
# cluster), finalizers and every label, such as the cluster set. This policy limits its writes to
# what Add to AI Grid and Remove change: labels ai-grid/* and location, and annotations ai-grid/*.
# Other users and controllers are unaffected. From ai-grid-env-setup's apps/console.
#
# The policy should be in force before the ClusterRole grants patch. Argo CD applies it first (sync
# wave -1). Helm applies kinds it doesn't know, such as this one, last, so turning
# backend.clusterWrites on with helm leaves the backend unrestricted for the moments until the
# policy loads; anyone who reaches the backend through the console already may patch
# ManagedClusters (isProviderAdmin).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "console.fullname" . }}-backend
  labels:
    {{- include "console.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [cluster.open-cluster-management.io]
        apiVersions: ["*"]
        resources: [managedclusters]
        operations: [UPDATE]
  matchConditions:
    - name: console-backend
      expression: {{ printf "request.userInfo.username == 'system:serviceaccount:%s:%s'" .Release.Namespace (include "console.serviceAccountName" .) | quote }}
  variables:
    - { name: nl, expression: "has(object.metadata.labels) ? object.metadata.labels : {}" }
    - { name: ol, expression: "has(oldObject.metadata.labels) ? oldObject.metadata.labels : {}" }
    - { name: na, expression: "has(object.metadata.annotations) ? object.metadata.annotations : {}" }
    - { name: oa, expression: "has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {}" }
  validations:
    - expression: "object.spec == oldObject.spec"
      message: "the console backend may not change a ManagedCluster's spec"
    - expression: "(has(object.metadata.finalizers) ? object.metadata.finalizers : []) == (has(oldObject.metadata.finalizers) ? oldObject.metadata.finalizers : [])"
      message: "the console backend may not change finalizers"
    # OwnerReferencesPermissionEnforcement already refuses this (the backend can't delete
    # clusters); checked here too, so a later delete grant can't turn an owner reference into a
    # deletion.
    - expression: "(has(object.metadata.ownerReferences) ? object.metadata.ownerReferences : []) == (has(oldObject.metadata.ownerReferences) ? oldObject.metadata.ownerReferences : [])"
      message: "the console backend may not change owner references"
    - expression: >-
        variables.nl.all(k, k.startsWith('ai-grid/') || k == 'location' || (k in variables.ol && variables.ol[k] == variables.nl[k]))
        && variables.ol.all(k, k.startsWith('ai-grid/') || k == 'location' || k in variables.nl)
      message: "the console backend may change only ai-grid/* and location labels"
    - expression: >-
        variables.na.all(k, k.startsWith('ai-grid/') || (k in variables.oa && variables.oa[k] == variables.na[k]))
        && variables.oa.all(k, k.startsWith('ai-grid/') || k in variables.na)
      message: "the console backend may change only ai-grid/* annotations"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "console.fullname" . }}-backend
  labels:
    {{- include "console.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  policyName: {{ include "console.fullname" . }}-backend
  validationActions: [Deny]
{{- end }}
