# Does the BFF's copy of the backend's messages (mock/proto/ai_grid/backend/v1) still match
# the backend? Nightly, and on demand, this refreshes the vendored copy in mock/proto/upstream
# from the backend's main branch (or the ref you give) and runs the drift test against it. The
# refresh happens in the runner's checkout only; nothing is committed. A failure means the
# backend changed a message or RPC the BFF uses: run hack/sync-upstream-proto.sh <ref>
# locally, update the copy and bff/internal/backend/v1.go, and commit them together.
name: Proto drift

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: Backend branch, tag or commit to check against
        default: main

permissions:
  contents: read

jobs:
  drift:
    name: The BFF's copy matches the backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: bff/go.mod
          cache-dependency-path: bff/go.sum
      - name: Refresh the vendored backend proto (not committed)
        env:
          REF: ${{ inputs.ref || 'main' }}
        run: hack/sync-upstream-proto.sh "$REF"
      - name: What changed upstream since the vendored commit
        run: git --no-pager diff --stat -- mock/proto/upstream
      - name: Drift test
        working-directory: bff
        run: go test -count=1 ./internal/protodrift/
