name: publish-image

# First half of the pull request image pipeline: build the PR's image without credentials and hand
# it to publish-pr-image.yaml as an OCI archive artifact, which pushes it as pr-<number>. The split
# exists because a pull request from a fork gets a read-only GITHUB_TOKEN, and the half that holds a
# write token must never run PR code.
#
# Images from main, v* tags and manual runs are published by the image job in ci.yaml, after every
# check. The workflow name is load-bearing: publish-pr-image.yaml triggers on it.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/ai-grid-provider-console
      # Untagged on purpose: each tag becomes a separate image in the archive and skopeo then refuses
      # to pick one. publish-pr-image.yaml applies the pr-<number> tag.
      - name: Build to an OCI archive
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          outputs: type=oci,dest=/tmp/ai-grid-provider-console.tar
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.event.pull_request.head.sha }}
          cache-from: type=gha,scope=ai-grid-provider-console
          cache-to: type=gha,mode=max,scope=ai-grid-provider-console,ignore-error=true
          provenance: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr-image-ai-grid-provider-console
          path: /tmp/ai-grid-provider-console.tar
          # It only has to last until publish-pr-image.yaml downloads it.
          retention-days: 1
          # The layers are already compressed.
          compression-level: 0
