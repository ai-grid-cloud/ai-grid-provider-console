name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  bff:
    name: BFF
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bff
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: bff/go.mod
          cache-dependency-path: bff/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...
      - name: lint proto (buf via go run)
        run: make lint-proto
      - name: generated code is current
        run: make check-generated
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: bff

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    needs: [bff, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: bff/go.mod
          cache-dependency-path: bff/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: make e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  contract:
    name: Contract pointer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # contract/ai_grid/v1 is vendored, so it can be hand-edited or drift from its pin
      # without anything noticing. This refetches at the pinned commit and diffs.
      #
      # It cannot tell you the pin names the RIGHT repository: a valid pointer at the wrong
      # backend passes, which is exactly how the old drift job stayed green for weeks.
      # That one is a review question, not a check (CODING_STANDARDS.md, "Documentation").
      - name: vendored contract matches its pinned commit
        run: |
          repo="$(sed -n 's|^repo=||p' contract/COMMIT)"
          commit="$(sed -n 's|^commit=||p' contract/COMMIT)"
          path="$(sed -n 's|^path=||p' contract/COMMIT)"
          slug="${repo#https://github.com/}"
          echo "::notice::vendored from ${slug} @ ${commit}"
          mkdir -p /tmp/upstream
          gh api "repos/${slug}/contents/${path}?ref=${commit}" \
            --jq '.[] | select(.name | endswith(".proto")) | .name' > /tmp/names
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            gh api -H "Accept: application/vnd.github.raw" \
              "repos/${slug}/contents/${path}/${f}?ref=${commit}" > "/tmp/upstream/${f}"
          done < /tmp/names
          diff -r /tmp/upstream contract/ai_grid/v1
        env:
          GH_TOKEN: ${{ github.token }}

  manifests:
    name: Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: kustomize build
        run: kubectl kustomize manifests/base > /dev/null

  image:
    name: Container image
    runs-on: ubuntu-latest
    needs: [bff, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ai-grid-provider-console:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
