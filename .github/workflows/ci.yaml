name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels the run it supersedes. Every other run (main, tags,
# manual) gets a group of its own, so it is never cancelled and never queued: GitHub keeps only
# one pending run per group and cancels it when a newer one arrives, whatever cancel-in-progress
# says. Every merged commit gets its checks and its image.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# timeout-minutes: about three times the slowest job seen (CI runs of 2026-10), so a hung step
# fails the job instead of holding a runner for GitHub's default 6 hours.
jobs:
  bff:
    name: BFF
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bff
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: bff/go.mod
          cache-dependency-path: bff/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...
      - name: lint proto (buf via go run)
        run: make lint-proto
      - name: generated code is current
        run: make check-generated
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          # Pinned, like the backend's. Built from source with the Go from setup-go, because
          # golangci-lint rejects modules newer than the Go it was built with.
          version: v2.12.2
          install-mode: goinstall
          working-directory: bff

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.22.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      # For buf (go run) in make check-generated-api.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: bff/go.mod
          cache-dependency-path: bff/go.sum
      - run: pnpm install --frozen-lockfile
      # src/gen is what the backend's proto at .backend-api-version generates: not stale, not edited.
      - name: generated API is current (buf via go run)
        working-directory: .
        run: make check-generated-api
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # The @playwright/test version frontend/package.json pins, for the Browser tests job's image.
  playwright-version:
    name: Playwright version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: frontend/package.json
          sparse-checkout-cone-mode: false
      - id: version
        run: |
          version=$(jq -r '.devDependencies["@playwright/test"]' frontend/package.json)
          if ! grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+' <<<"${version}"; then
            echo "::error file=frontend/package.json::@playwright/test must be an exact x.y.z version, for the Playwright image's tag; got '${version}'"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  # Not after BFF and Frontend: it uses nothing they produce, and CI passed requires all three.
  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    needs: [playwright-version]
    timeout-minutes: 15
    # Playwright's image has the browsers and their system libraries, so nothing is installed per
    # run (the install took 18-525 s). Its tag follows the @playwright/test version in
    # frontend/package.json, so a Dependabot bump moves both: the image's Playwright must match the
    # package's, or it can't find its browsers (https://playwright.dev/docs/docker#image-tags), and
    # Microsoft publishes one image per Playwright release, so a version's tag matches its package.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: bff/go.mod
          cache-dependency-path: bff/go.sum
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.22.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      # make e2e; the image has no make.
      - run: pnpm e2e
        working-directory: frontend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  manifests:
    name: Manifests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: kustomize build
        run: kubectl kustomize manifests/base > /dev/null
      - name: Helm chart lint, and its defaults render manifests/base
        run: hack/check-chart.sh
      - name: PR-image delete logic
        run: hack/test-image-workflows.sh

  # Not after Manifests: it uses nothing that job produces, and CI passed requires both.
  chart:
    name: Helm chart on kind
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # kind, helm and kubectl come with the runner image.
      - run: hack/test-chart-kind.sh

  # The one check the main ruleset needs to require. GitHub counts a skipped job as passing, and
  # a job skipped because one it needs failed counts too, so requiring each job by name lets a PR
  # merge with Browser tests or Helm chart on kind red. This job always runs and fails unless every
  # job a pull request runs succeeded. Add a job a pull request runs to its needs.
  passed:
    name: CI passed
    if: always()
    needs: [bff, frontend, playwright-version, e2e, manifests, chart]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"${NEEDS}"
          jq -e 'all(.[]; .result == "success")' <<<"${NEEDS}" >/dev/null

  # Publishes ghcr.io/ai-grid-cloud/ai-grid-provider-console after every check passes, so a commit
  # whose checks failed never ships sha-*, latest or a version. Deploy the sha-<full sha> tag, not
  # latest. Pull requests build their image in publish-image.yaml instead, published as pr-<number>.
  image:
    name: Container image
    needs: [bff, frontend, e2e, manifests, chart]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # GITHUB_TOKEN pushes to ghcr.io for this organization's repositories; no stored secret.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/ai-grid-provider-console
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # Only the default-branch rule above sets latest; the default
          # latest=auto would also move it on every v* tag.
          flavor: |
            latest=false
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          # Stated, not inherited, so a runner change can't ship an image the cluster can't run.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: CONSOLE_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=ai-grid-provider-console
          cache-to: type=gha,mode=max,scope=ai-grid-provider-console,ignore-error=true
          # No unknown/unknown attestation manifest: it shows as a phantom untagged version in ghcr.
          provenance: false
