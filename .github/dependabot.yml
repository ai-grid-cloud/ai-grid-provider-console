# Weekly update PRs for what CI and the image build pin: action SHAs, the Dockerfile's base
# images (tag and digest), the BFF's Go modules and the frontend's npm packages (pnpm lockfile).
# Minor and patch updates are grouped per ecosystem. Major updates are ignored during the
# RHOAI 3.6 code freeze; upgrade a major by hand in its own PR. Base images are the exception:
# UBI tags are build numbers, so every UBI update reads as a major, and ignoring majors would
# stop them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      images:
        update-types: [minor, patch]
  - package-ecosystem: gomod
    directory: /bff
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      go:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        update-types: [minor, patch]
