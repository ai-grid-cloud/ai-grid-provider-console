# Weekly update PRs for what CI and the image build pin: action SHAs, the Dockerfile's base
# images (tag and digest), the BFF's Go modules and the frontend's npm packages (pnpm lockfile).
# Minor and patch updates are grouped per ecosystem; a major update gets its own PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      images:
        update-types: [minor, patch]
  - package-ecosystem: gomod
    directory: /bff
    schedule:
      interval: weekly
    groups:
      go:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm:
        update-types: [minor, patch]
